<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLATE LOG">
<meta name="theme-color" content="#18170F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>PLATE LOG - 筋トレ記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#18170F;
    --surface:#221F16;
    --surface-2:#2C2818;
    --border:#3A351F;
    --text:#F2EEE1;
    --text-muted:#9C9575;
    --gold:#E8B23D;
    --gold-dim:#B98A2E;
    --chest:#E0654A;
    --back:#4FA3D1;
    --shoulders:#E8B23D;
    --legs:#9B7FD1;
    --arms:#6FBF73;
    --abs:#D9CF4A;
    --cardio:#3EC6C6;
    --cardio-kcal:#D96FB0;
    --danger:#D1524F;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    overscroll-behavior-y:none;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(circle at 15% 0%, rgba(232,178,61,0.07), transparent 40%),
      var(--bg);
    position:relative;
  }
  header.top{
    padding:calc(6px + var(--safe-top)) 20px 6px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .wordmark{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.06em;
    color:var(--gold);
    text-transform:uppercase;
  }
  main{
    flex:1;
    padding:12px 16px calc(78px + var(--safe-bottom));
    overflow-y:auto;
  }
  h2.section-title{
    font-family:'Oswald',sans-serif;
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--text-muted);
    margin:16px 0 8px;
  }
  h2.section-title:first-child{margin-top:0;}
  .section-title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:16px 0 8px;
  }
  .section-title-row .section-title{margin:0;}
  .section-title-row .edit-toggle{
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:4px 2px;
  }
  .section-title-row .edit-toggle.active{color:var(--gold);}

  /* date row */
  .date-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:7px 10px;
  }
  .date-row button.arrow{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    width:32px;height:32px;
    border-radius:10px;
    font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .date-row .date-label{
    flex:1;
    text-align:center;
    position:relative;
  }
  .date-row .date-label .big{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:17px;
  }
  .date-row .date-label .today-tag{
    font-size:10px;
    color:var(--gold);
    letter-spacing:0.06em;
    margin-left:6px;
  }
  .date-row input[type=date]{
    position:absolute;
    inset:0;
    opacity:0;
    width:100%;
    height:100%;
  }

  /* body part chips */
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding-bottom:4px;
  }
  .chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    position:relative;
  }
  .chip.active{
    color:#18170F;
    border-color:transparent;
  }
  .chip .dot{
    display:inline-block;
    width:8px;height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
  }

  /* exercise grid */
  .ex-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .ex-btn{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 10px;
    border-radius:12px;
    font-size:14px;
    font-weight:500;
    text-align:center;
    line-height:1.3;
  }
  .ex-btn.active{
    border-color:var(--gold);
    background:rgba(232,178,61,0.12);
    color:var(--gold);
    font-weight:700;
  }
  .ex-btn.add-new{
    border-style:dashed;
    color:var(--text-muted);
  }
  .add-exercise-form{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .add-exercise-form input{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    padding:10px 12px;
    font-size:14px;
  }
  .add-exercise-form button{
    background:var(--gold);
    color:#18170F;
    border:none;
    border-radius:10px;
    padding:0 16px;
    font-weight:700;
  }

  /* exercise edit list */
  .ex-edit-list{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .ex-edit-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px 10px 8px 14px;
  }
  .ex-edit-row .ex-edit-name{
    flex:1;
    min-width:0;
    font-size:14px;
    color:var(--text);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .ex-edit-row .ex-edit-actions{
    display:flex;
    gap:4px;
    flex:0 0 auto;
  }
  .ex-edit-row .ex-edit-actions button{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    width:32px;height:32px;
    border-radius:8px;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .ex-edit-row .ex-edit-actions button:disabled{opacity:0.3;}
  .ex-edit-row .ex-edit-actions button.del-ex{
    color:var(--danger);
    border-color:var(--danger);
  }

  /* set entry card */
  .entry-card{
    margin-top:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:12px;
  }
  .entry-card .ex-name{
    font-family:'Oswald',sans-serif;
    font-size:16px;
    font-weight:600;
    margin-bottom:10px;
    color:var(--text);
  }

  /* today's target chip */
  .target-chip{
    background:rgba(232,178,61,0.08);
    border:1px solid rgba(232,178,61,0.35);
    border-radius:12px;
    padding:8px 12px;
    margin-bottom:10px;
  }
  .target-chip .target-top-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:6px;
  }
  .target-chip .target-label{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--text-muted);
    text-transform:uppercase;
  }
  .target-chip .target-body{
    font-size:13px;
    color:var(--text-muted);
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .target-chip .target-body .mono{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--text);
  }
  .target-chip .target-body .mono.gold{color:var(--gold);}
  .target-chip .target-apply{
    flex:0 0 auto;
    background:none;
    border:1px solid var(--gold);
    color:var(--gold);
    font-size:11px;
    font-weight:700;
    padding:4px 10px;
    border-radius:20px;
  }

  /* cardio voice input */
  .voice-wrap{margin-bottom:14px;}
  .voice-mic-btn{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
  }
  .voice-dictation-input{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    border:0;
    opacity:0;
    overflow:hidden;
  }
  .voice-status:not(:empty){margin-top:10px;}
  .voice-confirm{
    background:rgba(232,178,61,0.08);
    border:1px solid rgba(232,178,61,0.35);
    border-radius:12px;
    padding:12px;
  }
  .voice-confirm-msg{
    font-size:13px;
    color:var(--text);
    line-height:1.5;
    margin-bottom:10px;
  }
  .voice-confirm-actions{
    display:flex;
    gap:8px;
  }
  .voice-confirm-actions button{
    flex:1;
    padding:10px;
    border-radius:10px;
    font-weight:700;
    font-size:13px;
  }
  .voice-confirm-save{
    background:var(--gold);
    color:#18170F;
    border:none;
  }
  .voice-confirm-edit{
    background:none;
    border:1px solid var(--border);
    color:var(--text);
  }
  .voice-error{
    background:rgba(209,82,79,0.1);
    border:1px solid rgba(209,82,79,0.35);
    color:var(--text-muted);
    border-radius:12px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.5;
  }

  .stepper-row{
    display:flex;
    gap:14px;
    margin-bottom:10px;
  }
  .stepper{
    flex:1;
    min-width:0;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:6px 8px;
    text-align:center;
  }
  .stepper .label{
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .stepper .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:4px;
    margin-top:4px;
  }
  .stepper button{
    flex:0 0 auto;
    background:var(--border);
    color:var(--text);
    border:none;
    width:26px;height:26px;
    border-radius:7px;
    font-size:15px;
    font-weight:700;
  }
  .stepper input{
    flex:1;
    min-width:0;
    width:auto;
    background:transparent;
    border:none;
    color:var(--gold);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:22px;
    text-align:center;
  }
  .add-set-btn{
    width:100%;
    background:var(--gold);
    color:#18170F;
    border:none;
    padding:11px;
    border-radius:12px;
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .set-list{
    margin-top:10px;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .set-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--surface-2);
    border-radius:10px;
    padding:7px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
  }
  .set-row .set-num{color:var(--text-muted); width:26px;}
  .set-row .del{
    background:none;border:none;color:var(--text-muted);font-size:16px;padding:2px 6px;
  }

  /* today summary */
  .summary-chips{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:6px;
  }
  .summary-chip{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:6px 10px;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .summary-chip .val{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--text);
  }

  /* history */
  .day-block{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .day-block .day-header{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:15px;
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .day-header .del-day{
    background:none;border:none;color:var(--text-muted);font-size:12px;
  }
  .bp-group{margin-bottom:10px;}
  .bp-group:last-child{margin-bottom:0;}
  .bp-group .bp-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:0.04em;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:6px;
    justify-content:space-between;
  }
  .ex-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:6px 0;
    border-top:1px solid var(--border);
    font-size:13px;
  }
  .ex-row .ex-title{color:var(--text);}
  .ex-row .ex-sets{color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:12px;}
  .ex-row .del{background:none;border:none;color:var(--text-muted);font-size:14px;margin-left:8px;}
  .empty-state{
    text-align:center;
    color:var(--text-muted);
    padding:60px 20px;
    font-size:14px;
    line-height:1.7;
  }

  /* segmented control (history: 日付別 / 部位別) */
  .segmented{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:3px;
    margin-bottom:16px;
  }
  .segmented button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-muted);
    font-size:13px;
    font-weight:600;
    padding:8px 0;
    border-radius:9px;
  }
  .segmented button.active{
    background:var(--gold);
    color:#18170F;
  }

  /* history: 部位別 view */
  .bp-history-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .bp-history-row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .bp-history-row .bp-history-main{flex:1; min-width:0;}
  .bp-history-row .bp-history-ex{
    font-size:14px;
    font-weight:600;
    color:var(--text);
    margin-bottom:4px;
  }
  .bp-history-row .bp-history-sets{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--text-muted);
  }
  .bp-history-row .bp-history-total{
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:700;
    color:var(--text);
  }
  .bp-history-row .bp-history-right{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .bp-history-row .bp-history-right-bottom{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .bp-history-row .bp-history-date{
    font-size:12px;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .bp-history-row .del{background:none;border:none;color:var(--text-muted);font-size:14px;}

  /* graph */
  .score-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
  }
  .score-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .score-top-dual{
    flex-direction:column;
    align-items:stretch;
    gap:12px;
  }
  .score-top-dual .score-block{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .score-top-dual .score-value{font-size:28px;}
  .score-label{
    font-size:12px;
    color:var(--text-muted);
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .score-value{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:40px;
    line-height:1;
    color:var(--gold);
  }
  .score-value span{font-size:18px; color:var(--text-muted); margin-left:4px;}
  .score-delta{
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    padding:4px 8px;
    border-radius:8px;
  }
  .score-delta.up{color:var(--arms); background:rgba(111,191,115,0.12);}
  .score-delta.down{color:var(--danger); background:rgba(209,82,79,0.12);}
  .score-delta.flat{color:var(--text-muted); background:var(--surface-2);}
  .chart-wrap{margin-top:16px; height:220px;}
  .chart-legend{
    display:flex;
    gap:16px;
    margin-top:14px;
    font-size:12px;
    color:var(--text-muted);
  }
  .chart-legend .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .chart-legend .dot{
    width:8px;height:8px;border-radius:50%;display:inline-block;
  }
  .chart-legend .dot.hollow{
    background:none;
    border:1.5px solid var(--text-muted);
    box-sizing:border-box;
  }
  .chart-legend .legend-line{
    width:12px;height:0;border-top:2px solid var(--text-muted);display:inline-block;opacity:0.6;
  }
  .ma-summary{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .ma-summary-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .ma-summary-row + .ma-summary-row{margin-top:12px;}
  .ma-summary-label{
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:0.08em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .ma-summary-value{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1;
  }
  .ma-summary-value span{font-size:14px; color:var(--text-muted); margin-left:4px; font-weight:500;}
  .ma-summary-trend{
    font-size:13px;
    color:var(--text-muted);
    margin-top:12px;
  }
  .ma-summary-trend .mono{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    color:var(--gold);
  }
  .range-slider-wrap{
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  .range-slider-label{
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .range-slider-wrap input[type=range]{
    display:block;
    width:100%;
    accent-color:var(--gold);
    height:4px;
    cursor:pointer;
  }

  /* graph overview */
  .graph-overview-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .graph-overview-header .section-title{margin:0;}
  .reorder-toggle{
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    padding:7px 14px;
    border-radius:20px;
  }
  .reorder-toggle.active{
    color:#18170F;
    background:var(--gold);
    border-color:transparent;
  }
  .mini-card-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:22px;
  }
  .mini-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .mini-card.tappable{cursor:pointer;}
  .mini-card-main{flex:1; min-width:0;}
  .mini-card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
  }
  .mini-card-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    font-size:17px;
    color:var(--text);
  }
  .mini-card-name .dot{
    width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto;
  }
  .mini-card-name .mini-card-best{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--text-muted);
    white-space:nowrap;
  }
  .mini-card-suggestion{
    font-size:13px;
    font-weight:600;
    color:var(--text-muted);
  }
  .mini-card-deltas{
    display:flex;
    gap:6px;
    flex:0 0 auto;
  }
  .score-delta.mini{
    font-size:11px;
    padding:2px 6px;
    border-radius:6px;
  }
  .mini-card-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .mini-card-value{
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:18px;
    color:var(--gold);
    white-space:nowrap;
  }
  .mini-card-value .unit{
    font-size:12px;
    color:var(--text-muted);
    margin-left:2px;
    font-weight:500;
  }
  .mini-card-value .sep{
    color:var(--text-muted);
    font-size:12px;
    margin:0 4px;
    font-weight:500;
  }
  .mini-sparkline{
    flex:0 0 auto;
    width:110px;
    height:36px;
    display:block;
  }
  .mini-sparkline svg{display:block;width:100%;height:100%;}
  .mini-card-empty{
    color:var(--text-muted);
    font-size:13px;
    padding:4px 0;
  }
  .mini-card-reorder{
    display:flex;
    gap:6px;
    flex:0 0 auto;
  }
  .mini-card-reorder button{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    width:30px;height:30px;
    border-radius:8px;
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
  }
  .mini-card-reorder button:disabled{opacity:0.3;}

  /* toast */
  #toast{
    position:fixed;
    left:50%;
    bottom:calc(90px + var(--safe-bottom));
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 16px;
    border-radius:12px;
    font-size:13px;
    display:flex;
    gap:12px;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s, transform 0.2s;
    z-index:50;
    max-width:90%;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  #toast button{
    background:none;border:none;color:var(--gold);font-weight:700;font-size:13px;
  }
  #toast.pr{
    border-color:var(--gold);
    align-items:flex-start;
  }
  .toast-pr-icon{
    color:var(--gold);
    flex:0 0 auto;
    display:flex;
    align-items:center;
    padding-top:2px;
  }
  .toast-pr-body{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .toast-pr-head{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--gold);
    letter-spacing:0.02em;
  }
  .toast-pr-main{
    font-size:13px;
    color:var(--text);
  }
  .toast-pr-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--text-muted);
  }

  /* bottom nav */
  nav.tabbar{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:0;
    width:100%;
    max-width:480px;
    background:rgba(24,23,15,0.94);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;
    padding:4px 10px calc(4px + var(--safe-bottom));
  }
  nav.tabbar button{
    flex:1;
    background:none;
    border:none;
    color:var(--text-muted);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    padding:1px 0;
  }
  nav.tabbar button.active{color:var(--gold);}
  nav.tabbar svg{width:25px;height:25px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wordmark">PLATE LOG</div>
  </header>
  <main id="main"></main>
  <div id="toast"></div>
  <nav class="tabbar">
    <button data-tab="record">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5l11 11M4 9l3-3 2 2-3 3-2-2zm11 11l3-3-2-2-3 3 2 2zM2 9l2-2M20 20l2-2M9 4l2 2M17.5 12.5l2 2-3 3-2-2 3-3z"/></svg>
      記録
    </button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      履歴
    </button>
    <button data-tab="graph">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M11 19V4M18 19v-7"/></svg>
      グラフ
    </button>
  </nav>
</div>

<script>
(function(){
  const BODY_PARTS = [
    {key:'chest', label:'胸', color:'var(--chest)', hex:'#E0654A'},
    {key:'back', label:'背中', color:'var(--back)', hex:'#4FA3D1'},
    {key:'shoulders', label:'肩', color:'var(--shoulders)', hex:'#E8B23D'},
    {key:'legs', label:'脚', color:'var(--legs)', hex:'#9B7FD1'},
    {key:'arms', label:'腕', color:'var(--arms)', hex:'#6FBF73'},
    {key:'abs', label:'腹筋', color:'var(--abs)', hex:'#D9CF4A'},
    {key:'cardio', label:'有酸素', color:'var(--cardio)', hex:'#3EC6C6'}
  ];
  const CARDIO_KEY = 'cardio';
  const CARDIO_KCAL_HEX = '#D96FB0';
  function isCardio(bodyPartKey){ return bodyPartKey === CARDIO_KEY; }
  const PRESET_EXERCISES = {
    chest: ['ベンチプレス','インクラインベンチプレス','ダンベルプレス','チェストプレス','ダンベルフライ','ディップス'],
    back: ['デッドリフト','ラットプルダウン','ベントオーバーロウ','シーテッドロウ','懸垂'],
    shoulders: ['ショルダープレス','サイドレイズ','リアレイズ','アップライトロウ'],
    legs: ['スクワット','レッグプレス','レッグエクステンション','レッグカール','ランジ','カーフレイズ'],
    arms: ['バーベルカール','ダンベルカール','トライセプスプレスダウン','ハンマーカール','スカルクラッシャー'],
    abs: ['クランチ','レッグレイズ','ケーブルクランチ','アブローラー'],
    cardio: ['トレッドミル','エアロバイク','クロストレーナー']
  };
  const STORAGE_KEY = 'plate-log-data-v1';
  const GRAPH_RANGE_PRESETS = [
    {days:7, label:'1週間'},
    {days:14, label:'2週間'},
    {days:30, label:'1ヶ月'},
    {days:60, label:'2ヶ月'},
    {days:90, label:'3ヶ月'}
  ];
  const MA_WINDOW = 4; // moving-average / "rising streak" window for the detail graph trend line

  function toISO(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  const DAY_CUTOVER_HOUR = 3; // "today" doesn't roll over to the next calendar date until 3am local time
  function logicalToday(){
    const d = new Date();
    if(d.getHours() < DAY_CUTOVER_HOUR) d.setDate(d.getDate()-1);
    return toISO(d);
  }
  function addDays(iso, n){
    const d = new Date(iso+'T00:00:00');
    d.setDate(d.getDate()+n);
    return toISO(d);
  }

  let state = {
    sessions: [], // {id, date, bodyPart, exercise, sets:[{weight,reps}]}
    exerciseOrder: {}, // bodyPart -> [names], user-editable list & order (seeded from PRESET_EXERCISES)
    bodyPartOrder: [], // bodyPart keys in display order for the graph overview screen
    graphRangeDays: 14 // last-used detail-graph slider range, persisted so it survives reloads
  };
  let ui = {
    tab: 'record',
    recordView: 'overview', // 'overview' (body-part picker) | 'detail' (date + exercise + set entry)
    date: logicalToday(),
    bodyPart: 'chest',
    exercise: null,
    showAddExercise: false,
    editExercises: false,
    draft: {weight:20, reps:10},
    graphBodyPart: 'chest',
    graphRangeDays: 14, // overwritten from state.graphRangeDays once loadData() resolves
    reorderMode: false,
    historyView: 'date', // 'date' | 'bodyPart'
    historyBodyPart: 'chest'
  };
  let lastDeleted = null; // for undo

  function fmtShort(iso){
    const [y,m,d] = iso.split('-');
    return `${parseInt(m)}/${parseInt(d)}`;
  }
  function fmtLong(iso){
    const d = new Date(iso+'T00:00:00');
    const wd = ['日','月','火','水','木','金','土'][d.getDay()];
    const [y,m,day] = iso.split('-');
    return `${parseInt(m)}月${parseInt(day)}日(${wd})`;
  }
  function bp(key){ return BODY_PARTS.find(b=>b.key===key); }
  function exerciseList(key){
    return state.exerciseOrder[key] || [];
  }
  function sessionVolume(s){
    return s.sets.reduce((a,st)=>a+st.weight*st.reps,0);
  }
  function sessionDistance(s){
    return s.sets.reduce((a,st)=>a+(st.distance||0),0);
  }
  function sessionCalories(s){
    return s.sets.reduce((a,st)=>a+(st.calories||0),0);
  }
  function round1(n){
    return Math.round(n*10)/10;
  }

  async function loadData(){
    let parsed = null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) parsed = JSON.parse(raw);
    }catch(e){ /* corrupt data, fall back to defaults */ }

    state.sessions = (parsed && parsed.sessions) || [];
    const savedOrder = parsed && parsed.exerciseOrder;
    const savedCustom = (parsed && parsed.customExercises) || {}; // legacy field, migrated below
    state.exerciseOrder = {};
    BODY_PARTS.forEach(b=>{
      if(savedOrder && savedOrder[b.key]){
        state.exerciseOrder[b.key] = savedOrder[b.key];
      }else{
        state.exerciseOrder[b.key] = [...(PRESET_EXERCISES[b.key]||[]), ...(savedCustom[b.key]||[])];
      }
    });

    const allKeys = BODY_PARTS.map(b=>b.key);
    const savedBodyPartOrder = parsed && parsed.bodyPartOrder;
    if(Array.isArray(savedBodyPartOrder) && savedBodyPartOrder.length){
      const valid = savedBodyPartOrder.filter(k=>allKeys.includes(k));
      const missing = allKeys.filter(k=>!valid.includes(k));
      state.bodyPartOrder = [...valid, ...missing];
    }else{
      state.bodyPartOrder = allKeys;
    }

    const savedRangeDays = parsed && parsed.graphRangeDays;
    state.graphRangeDays = GRAPH_RANGE_PRESETS.some(p=>p.days===savedRangeDays) ? savedRangeDays : 14;
    ui.graphRangeDays = state.graphRangeDays;
  }
  async function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error('save failed', e); }
  }

  // toast queue: avoids overlapping simultaneous toasts (e.g. a PR toast and a delete-undo toast)
  let toastQueue = [];
  let toastActive = false;

  function queueToast(build, duration){
    toastQueue.push({build, duration});
    processToastQueue();
  }
  function processToastQueue(){
    if(toastActive || !toastQueue.length) return;
    const item = toastQueue.shift();
    toastActive = true;
    const t = document.getElementById('toast');
    t.className = '';
    t.innerHTML = '';
    item.build(t);
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(hideToastNow, item.duration);
  }
  function hideToastNow(){
    const t = document.getElementById('toast');
    clearTimeout(t._timer);
    t.classList.remove('show');
    toastActive = false;
    setTimeout(processToastQueue, 220); // wait for fade-out transition before showing next
  }

  function showToast(msg, onUndo){
    queueToast((t)=>{
      const span = document.createElement('span');
      span.textContent = msg;
      t.appendChild(span);
      if(onUndo){
        const btn = document.createElement('button');
        btn.textContent = '元に戻す';
        btn.onclick = ()=>{ onUndo(); hideToastNow(); };
        t.appendChild(btn);
      }
    }, 4000);
  }

  const TROPHY_SVG = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/></svg>';

  function showPRToast(exercise, weight, reps, prInfo){
    queueToast((t)=>{
      t.classList.add('pr');
      const icon = document.createElement('span');
      icon.className = 'toast-pr-icon';
      icon.innerHTML = TROPHY_SVG;
      const body = document.createElement('div');
      body.className = 'toast-pr-body';
      const head = document.createElement('div');
      head.className = 'toast-pr-head';
      head.textContent = '自己ベスト更新';
      const main = document.createElement('div');
      main.className = 'toast-pr-main';
      main.textContent = `${exercise} ${weight}kg×${reps}回`;
      body.appendChild(head);
      body.appendChild(main);
      if(prInfo.weightPR){
        const p = document.createElement('div');
        p.className = 'toast-pr-sub';
        p.textContent = `自己ベスト ${prInfo.weightPR.prev}kg → ${prInfo.weightPR.now}kg`;
        body.appendChild(p);
      }
      if(prInfo.rmPR){
        const p = document.createElement('div');
        p.className = 'toast-pr-sub';
        p.textContent = `推定1RM ${prInfo.rmPR.prev}kg → ${prInfo.rmPR.now}kg`;
        body.appendChild(p);
      }
      t.appendChild(icon);
      t.appendChild(body);
    }, 5500);
  }

  // ---------- RECORD TAB ----------
  function findOrCreateSession(date, bodyPart, exercise){
    let s = state.sessions.find(x=>x.date===date && x.bodyPart===bodyPart && x.exercise===exercise);
    if(!s){
      s = {id: Date.now()+'-'+Math.random().toString(36).slice(2), date, bodyPart, exercise, sets:[]};
      state.sessions.push(s);
    }
    return s;
  }
  function lastUsedWeightReps(exercise){
    const matches = state.sessions.filter(s=>s.exercise===exercise && s.sets.length>0)
      .sort((a,b)=> a.date<b.date?1:-1);
    if(matches.length){
      const last = matches[0].sets[matches[0].sets.length-1];
      return {weight:last.weight, reps:last.reps};
    }
    return {weight:20, reps:10};
  }
  function lastUsedCardio(exercise){
    const matches = state.sessions.filter(s=>s.exercise===exercise && s.sets.length>0)
      .sort((a,b)=> a.date<b.date?1:-1);
    if(matches.length){
      const last = matches[0].sets[matches[0].sets.length-1];
      return {distance:last.distance, calories:last.calories};
    }
    return {distance:3, calories:200};
  }
  function draftFor(bodyPartKey, exercise){
    return isCardio(bodyPartKey) ? lastUsedCardio(exercise) : lastUsedWeightReps(exercise);
  }

  // 有酸素の音声入力: 発話は「距離→カロリー」の順を前提にパースする
  function parseVoiceCardio(text){
    if(!text) return null;
    const calMatch = text.match(/([0-9]+(?:\.[0-9]+)?)\s*(?:キロカロリー|カロリー|kcal)/i);
    if(!calMatch) return null;
    const withoutCal = text.slice(0, calMatch.index) + text.slice(calMatch.index + calMatch[0].length);
    const distMatch = withoutCal.match(/([0-9]+(?:\.[0-9]+)?)\s*(?:キロメートル|キロ|km)/i);
    if(!distMatch) return null;
    const calories = parseFloat(calMatch[1]);
    const distance = parseFloat(distMatch[1]);
    if(isNaN(calories) || isNaN(distance)) return null;
    return {distance: round1(distance), calories: Math.round(calories)};
  }

  // 機能A: 今日のターゲット提案 - show the max weight and max reps from the most recent prior session
  // (these can come from different sets, e.g. set1=80kg×8回, set2=75kg×10回 → 80kg / 10回)
  function targetSuggestion(bodyPart, exercise, beforeDate){
    const prior = state.sessions.filter(s=>s.bodyPart===bodyPart && s.exercise===exercise && s.date<beforeDate && s.sets.length>0)
      .sort((a,b)=> a.date<b.date?1:-1);
    if(!prior.length) return null;
    const sets = prior[0].sets;
    return {
      maxWeight: Math.max(...sets.map(st=>st.weight)),
      maxReps: Math.max(...sets.map(st=>st.reps))
    };
  }

  // 機能B: 自己ベスト検出 - compare a new set against all prior sets of the same exercise
  function estimated1RM(weight, reps){
    return weight * (1 + reps/30);
  }
  function computeSetPR(bodyPart, exercise, date, newSet){
    const priorSets = [];
    state.sessions.forEach(s=>{
      if(s.bodyPart!==bodyPart || s.exercise!==exercise) return;
      if(s.date<=date) priorSets.push(...s.sets);
    });
    if(!priorSets.length) return null;
    const maxWeight = Math.max(...priorSets.map(st=>st.weight));
    const max1RM = Math.max(...priorSets.map(st=>estimated1RM(st.weight, st.reps)));
    const newWeight = newSet.weight;
    const new1RM = estimated1RM(newSet.weight, newSet.reps);
    const result = {};
    if(newWeight>maxWeight) result.weightPR = {prev: maxWeight, now: newWeight};
    if(new1RM>max1RM) result.rmPR = {prev: round1(max1RM), now: round1(new1RM)};
    if(!result.weightPR && !result.rmPR) return null;
    return result;
  }

  function renderRecord(){
    if(ui.recordView==='detail') renderRecordDetail();
    else renderRecordOverview();
  }

  // page 1: body-part overview (today's rolling 7-day totals). Tap a card to open page 2.
  function renderRecordOverview(){
    const m = document.getElementById('main');
    const el = buildBodyPartOverview();
    m.innerHTML = '';
    m.appendChild(el);
    mountOverviewSparklines();
  }

  // page 2: date + exercise selection + set entry, for the body part chosen on page 1.
  function renderRecordDetail(){
    const m = document.getElementById('main');
    const el = document.createElement('div');

    // date row
    const dateRow = document.createElement('div');
    dateRow.className = 'date-row';
    dateRow.innerHTML = `
      <button class="arrow" data-act="prev-day">‹</button>
      <div class="date-label">
        <span class="big">${fmtLong(ui.date)}</span>
        ${ui.date===logicalToday() ? '<span class="today-tag">TODAY</span>' : ''}
        <input type="date" value="${ui.date}" id="date-input">
      </div>
      <button class="arrow" data-act="next-day">›</button>
    `;
    el.appendChild(dateRow);

    // exercise grid
    const exTitleRow = document.createElement('div');
    exTitleRow.className='section-title-row';
    const exTitle = document.createElement('h2');
    exTitle.className='section-title'; exTitle.textContent='種目を選択';
    exTitleRow.appendChild(exTitle);
    if(exerciseList(ui.bodyPart).length){
      const editToggle = document.createElement('button');
      editToggle.className='edit-toggle'+(ui.editExercises?' active':'');
      editToggle.textContent = ui.editExercises ? '完了' : '編集';
      editToggle.onclick = ()=>{ ui.editExercises = !ui.editExercises; ui.showAddExercise=false; render(); };
      exTitleRow.appendChild(editToggle);
    }
    el.appendChild(exTitleRow);

    if(ui.editExercises){
      const list = state.exerciseOrder[ui.bodyPart] || [];
      const editList = document.createElement('div');
      editList.className='ex-edit-list';
      list.forEach((name,i)=>{
        const row = document.createElement('div');
        row.className='ex-edit-row';
        const nameSpan = document.createElement('span');
        nameSpan.className='ex-edit-name';
        nameSpan.textContent = name;
        row.appendChild(nameSpan);

        const actions = document.createElement('div');
        actions.className='ex-edit-actions';

        const upBtn = document.createElement('button');
        upBtn.textContent='↑';
        upBtn.disabled = i===0;
        upBtn.onclick = ()=>{
          [list[i-1], list[i]] = [list[i], list[i-1]];
          saveData(); render();
        };
        const downBtn = document.createElement('button');
        downBtn.textContent='↓';
        downBtn.disabled = i===list.length-1;
        downBtn.onclick = ()=>{
          [list[i+1], list[i]] = [list[i], list[i+1]];
          saveData(); render();
        };
        const delBtn = document.createElement('button');
        delBtn.className='del-ex';
        delBtn.textContent='×';
        delBtn.onclick = ()=>{
          const removedIdx = i;
          const removedName = list.splice(i,1)[0];
          if(ui.exercise===removedName) ui.exercise = null;
          saveData();
          showToast(`${removedName}を削除しました`, ()=>{
            list.splice(removedIdx,0,removedName);
            saveData(); render();
          });
          render();
        };

        actions.appendChild(upBtn);
        actions.appendChild(downBtn);
        actions.appendChild(delBtn);
        row.appendChild(actions);
        editList.appendChild(row);
      });
      el.appendChild(editList);
    }else{
      const grid = document.createElement('div');
      grid.className='ex-grid';
      exerciseList(ui.bodyPart).forEach(name=>{
        const b = document.createElement('button');
        b.className='ex-btn'+(ui.exercise===name?' active':'');
        b.textContent = name;
        b.onclick = ()=>{
          ui.exercise = name;
          ui.draft = draftFor(ui.bodyPart, name);
          ui.showAddExercise = false;
          render();
        };
        grid.appendChild(b);
      });
      const addBtn = document.createElement('button');
      addBtn.className='ex-btn add-new';
      addBtn.textContent = '＋ 種目を追加';
      addBtn.onclick = ()=>{ ui.showAddExercise = !ui.showAddExercise; render(); };
      grid.appendChild(addBtn);

  function rollingSeries(bodyPart){
    const recDates = [...new Set(state.sessions.filter(s=>s.bodyPart===bodyPart).map(s=>s.date))].sort();
    return recDates.map(date=>{
      const start = addDays(date,-6);
      const vol = state.sessions.filter(s=> s.bodyPart===bodyPart && s.date>=start && s.date<=date)
        .reduce((a,s)=>a+sessionVolume(s),0);
      return {date, vol};
    });
  }

  function rollingSeriesDual(bodyPart){
    const recDates = [...new Set(state.sessions.filter(s=>s.bodyPart===bodyPart).map(s=>s.date))].sort();
    return recDates.map(date=>{
      const start = addDays(date,-6);
      const inRange = state.sessions.filter(s=> s.bodyPart===bodyPart && s.date>=start && s.date<=date);
      const km = round1(inRange.reduce((a,s)=>a+sessionDistance(s),0));
      const kcal = Math.round(inRange.reduce((a,s)=>a+sessionCalories(s),0));
      return {date, km, kcal};
    });
  }

  // daily-filled variants for the top-of-record overview: unlike rollingSeries/rollingSeriesDual
  // (which only plot dates that actually have a session), these plot every calendar day from the
  // body part's first recorded date through today, so the rolling 7-day total updates even on
  // days with no training (shown as that day's own contribution being 0).
  function rollingSeriesDailyAll(bodyPart){
    const recDates = state.sessions.filter(s=>s.bodyPart===bodyPart).map(s=>s.date);
    if(!recDates.length) return [];
    const minDate = recDates.reduce((a,b)=> a<b?a:b);
    const maxRecordDate = recDates.reduce((a,b)=> a>b?a:b);
    const today = logicalToday();
    const end = maxRecordDate>today ? maxRecordDate : today;
    const result = [];
    for(let d=minDate; d<=end; d=addDays(d,1)){
      const start = addDays(d,-6);
      const vol = state.sessions.filter(s=> s.bodyPart===bodyPart && s.date>=start && s.date<=d)
        .reduce((a,s)=>a+sessionVolume(s),0);
      result.push({date:d, vol});
    }
    return result;
  }
  function rollingSeriesDualDailyAll(bodyPart){
    const recDates = state.sessions.filter(s=>s.bodyPart===bodyPart).map(s=>s.date);
    if(!recDates.length) return [];
    const minDate = recDates.reduce((a,b)=> a<b?a:b);
    const maxRecordDate = recDates.reduce((a,b)=> a>b?a:b);
    const today = logicalToday();
    const end = maxRecordDate>today ? maxRecordDate : today;
    const result = [];
    for(let d=minDate; d<=end; d=addDays(d,1)){
      const start = addDays(d,-6);
      const inRange = state.sessions.filter(s=> s.bodyPart===bodyPart && s.date>=start && s.date<=d);
      const km = round1(inRange.reduce((a,s)=>a+sessionDistance(s),0));
      const kcal = Math.round(inRange.reduce((a,s)=>a+sessionCalories(s),0));
      result.push({date:d, km, kcal});
    }
    return result;
  }

  function buildDualLineChartSVG(series, colorA, colorB, opts={}){
    // series: [{date, a, b}] - each metric normalized to its own scale so the two lines share one plot area
    const mini = !!opts.mini;
    const width = opts.width || 300, height = opts.height || 190;
    const pad = mini ? {top:3, right:3, bottom:3, left:3} : {top:14, right:34, bottom:24, left:34};
    const innerW = width - pad.left - pad.right;
    const innerH = height - pad.top - pad.bottom;
    // provisional: today's live (unconfirmed) point, drawn as a dashed extension + hollow marker.
    // maSeries: N-record moving average, aligned 1:1 with `series` (confirmed points only).
    const provisional = !mini ? (opts.provisional || null) : null;
    const maSeries = !mini ? (opts.maSeries || null) : null;

    const plotSeries = provisional ? [...series, provisional] : series;
    const provisionalIdx = provisional ? plotSeries.length-1 : -1;
    const confirmedCount = provisionalIdx===-1 ? plotSeries.length : provisionalIdx;

    const maxA = Math.max(...plotSeries.map(p=>p.a), ...(maSeries ? maSeries.map(m=>m.a) : []), 1);
    const maxB = Math.max(...plotSeries.map(p=>p.b), ...(maSeries ? maSeries.map(m=>m.b) : []), 1);
    const stepX = plotSeries.length>1 ? innerW/(plotSeries.length-1) : 0;
    const ptsA = plotSeries.map((p,i)=>{
      const x = pad.left + (plotSeries.length>1 ? i*stepX : innerW/2);
      const y = pad.top + innerH - (p.a/maxA)*innerH;
      return {x,y,p};
    });
    const ptsB = plotSeries.map((p,i)=>{
      const x = pad.left + (plotSeries.length>1 ? i*stepX : innerW/2);
      const y = pad.top + innerH - (p.b/maxB)*innerH;
      return {x,y,p};
    });
    function splitPath(pts){
      const confirmed = pts.slice(0, confirmedCount);
      const solid = confirmed.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
      let dashedTail = '';
      if(provisionalIdx>-1 && confirmed.length){
        const lastPt = confirmed[confirmed.length-1], prov = pts[provisionalIdx];
        dashedTail = `M${lastPt.x.toFixed(1)},${lastPt.y.toFixed(1)} L${prov.x.toFixed(1)},${prov.y.toFixed(1)}`;
      }
      return {confirmed, solid, dashedTail};
    }
    const splitA = splitPath(ptsA), splitB = splitPath(ptsB);

    let gridLines = '', xLabels = '', dotsA = '', dotsB = '';
    if(!mini){
      for(let i=0;i<=3;i++){
        const y = pad.top + innerH*(i/3);
        const valA = round1(maxA*(1-i/3));
        const valB = Math.round(maxB*(1-i/3));
        gridLines += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width-pad.right}" y2="${y.toFixed(1)}" stroke="#3A351F" stroke-width="1"/>`;
        gridLines += `<text x="${(pad.left-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" font-family="JetBrains Mono, monospace" fill="${colorA}">${valA}</text>`;
        gridLines += `<text x="${(width-pad.right+6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="start" font-size="8" font-family="JetBrains Mono, monospace" fill="${colorB}">${valB}</text>`;
      }
      const labelIdxs = plotSeries.length<=5 ? plotSeries.map((_,i)=>i) : [0, Math.floor((plotSeries.length-1)/2), plotSeries.length-1];
      labelIdxs.forEach(i=>{
        const pt = ptsA[i];
        xLabels += `<text x="${pt.x.toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="9" font-family="JetBrains Mono, monospace" fill="#9C9575">${fmtShort(pt.p.date)}</text>`;
      });
      dotsA = splitA.confirmed.map(pt=>`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="${colorA}" stroke="#18170F" stroke-width="1.5"/>`).join('');
      dotsB = splitB.confirmed.map(pt=>`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="${colorB}" stroke="#18170F" stroke-width="1.5"/>`).join('');
      if(provisionalIdx>-1){
        const ptA = ptsA[provisionalIdx], ptB = ptsB[provisionalIdx];
        dotsA += `<circle cx="${ptA.x.toFixed(1)}" cy="${ptA.y.toFixed(1)}" r="4" fill="#18170F" stroke="${colorA}" stroke-width="2"/>`;
        dotsB += `<circle cx="${ptB.x.toFixed(1)}" cy="${ptB.y.toFixed(1)}" r="4" fill="#18170F" stroke="${colorB}" stroke-width="2"/>`;
      }
    }else if(ptsA.length===1){
      // single-point series would otherwise render nothing at all in mini mode
      dotsA = `<circle cx="${ptsA[0].x.toFixed(1)}" cy="${ptsA[0].y.toFixed(1)}" r="2.5" fill="${colorA}"/>`;
      dotsB = `<circle cx="${ptsB[0].x.toFixed(1)}" cy="${ptsB[0].y.toFixed(1)}" r="2.5" fill="${colorB}"/>`;
    }

    let maLines = '';
    if(maSeries && maSeries.length && splitA.confirmed.length){
      const maPtsA = maSeries.map((mp,i)=>({x:splitA.confirmed[i].x, y: pad.top + innerH - (mp.a/maxA)*innerH}));
      const maPtsB = maSeries.map((mp,i)=>({x:splitB.confirmed[i].x, y: pad.top + innerH - (mp.b/maxB)*innerH}));
      const maPathA = maPtsA.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
      const maPathB = maPtsB.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
      maLines = `<path d="${maPathA}" fill="none" stroke="${colorA}" stroke-width="1.5" stroke-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>`
        + `<path d="${maPathB}" fill="none" stroke="${colorB}" stroke-width="1.5" stroke-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>`;
    }

    return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${mini?'100%':'220px'};display:block;">
      ${gridLines}
      <path d="${splitA.solid}" fill="none" stroke="${colorA}" stroke-width="${mini?1.5:2.5}" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${splitB.solid}" fill="none" stroke="${colorB}" stroke-width="${mini?1.5:2.5}" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="${mini?'3 2':'4 3'}"/>
      ${splitA.dashedTail ? `<path d="${splitA.dashedTail}" fill="none" stroke="${colorA}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>` : ''}
      ${splitB.dashedTail ? `<path d="${splitB.dashedTail}" fill="none" stroke="${colorB}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="0.75"/>` : ''}
      ${maLines}
      ${dotsA}
      ${dotsB}
      ${xLabels}
    </svg>`;
  }

  function buildLineChartSVG(series, colorHex, opts={}){
    const mini = !!opts.mini;
    const gradId = opts.gradId || 'areaGrad';
    const width = opts.width || 300, height = opts.height || 190;
    const pad = mini ? {top:3, right:3, bottom:3, left:3} : {top:14, right:12, bottom:24, left:34};
    const innerW = width - pad.left - pad.right;
    const innerH = height - pad.top - pad.bottom;
    // provisional: today's live (unconfirmed) point, drawn as a dashed extension + hollow marker.
    // maSeries: N-record moving average, aligned 1:1 with `series` (confirmed points only).
    const provisional = !mini ? (opts.provisional || null) : null;
    const maSeries = !mini ? (opts.maSeries || null) : null;

    const plotSeries = provisional ? [...series, provisional] : series;
    const provisionalIdx = provisional ? plotSeries.length-1 : -1;
    const confirmedCount = provisionalIdx===-1 ? plotSeries.length : provisionalIdx;

    const maxVal = Math.max(...plotSeries.map(p=>p.vol), ...(maSeries ? maSeries.map(m=>m.ma) : []), 1);
    const stepX = plotSeries.length>1 ? innerW/(plotSeries.length-1) : 0;
    const points = plotSeries.map((p,i)=>{
      const x = pad.left + (plotSeries.length>1 ? i*stepX : innerW/2);
      const y = pad.top + innerH - (p.vol/maxVal)*innerH;
      return {x,y,p};
    });
    const confirmedPoints = points.slice(0, confirmedCount);
    const solidLinePath = confirmedPoints.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
    const fullLinePath = points.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
    let dashedLinePath = '';
    if(provisionalIdx>-1 && confirmedPoints.length){
      const lastPt = confirmedPoints[confirmedPoints.length-1], prov = points[provisionalIdx];
      dashedLinePath = `M${lastPt.x.toFixed(1)},${lastPt.y.toFixed(1)} L${prov.x.toFixed(1)},${prov.y.toFixed(1)}`;
    }
    const floorY = (pad.top+innerH).toFixed(1);
    const areaPath = points.length ? fullLinePath + ` L${points[points.length-1].x.toFixed(1)},${floorY} L${points[0].x.toFixed(1)},${floorY} Z` : '';

    let gridLines = '', xLabels = '', dots = '';
    if(!mini){
      for(let i=0;i<=3;i++){
        const y = pad.top + innerH*(i/3);
        const val = Math.round(maxVal*(1-i/3));
        gridLines += `<line x1="${pad.left}" y1="${y.toFixed(1)}" x2="${width-pad.right}" y2="${y.toFixed(1)}" stroke="#3A351F" stroke-width="1"/>`;
        gridLines += `<text x="${(pad.left-6).toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="8" font-family="JetBrains Mono, monospace" fill="#9C9575">${val}</text>`;
      }
      const labelIdxs = points.length<=5 ? points.map((_,i)=>i) : [0, Math.floor((points.length-1)/2), points.length-1];
      labelIdxs.forEach(i=>{
        const pt = points[i];
        xLabels += `<text x="${pt.x.toFixed(1)}" y="${height-6}" text-anchor="middle" font-size="9" font-family="JetBrains Mono, monospace" fill="#9C9575">${fmtShort(pt.p.date)}</text>`;
      });
      dots = confirmedPoints.map(pt=>`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4" fill="${colorHex}" stroke="#18170F" stroke-width="2"/>`).join('');
      if(provisionalIdx>-1){
        const pt = points[provisionalIdx];
        dots += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4.5" fill="#18170F" stroke="${colorHex}" stroke-width="2.5"/>`;
      }
    }else if(points.length===1){
      dots = `<circle cx="${points[0].x.toFixed(1)}" cy="${points[0].y.toFixed(1)}" r="2.5" fill="${colorHex}"/>`;
    }

    let maLine = '';
    if(maSeries && maSeries.length && confirmedPoints.length){
      const maPoints = maSeries.map((mp,i)=>({x:confirmedPoints[i].x, y: pad.top + innerH - (mp.ma/maxVal)*innerH}));
      const maPath = maPoints.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
      maLine = `<path d="${maPath}" fill="none" stroke="${colorHex}" stroke-width="1.5" stroke-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>`;
    }

    return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:${mini?'100%':'220px'};display:block;">
      <defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${colorHex}" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="${colorHex}" stop-opacity="0"/>
      </linearGradient></defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#${gradId})" stroke="none"/>
      <path d="${solidLinePath}" fill="none" stroke="${colorHex}" stroke-width="${mini?1.5:2.5}" stroke-linejoin="round" stroke-linecap="round"/>
      ${dashedLinePath ? `<path d="${dashedLinePath}" fill="none" stroke="${colorHex}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>` : ''}
      ${maLine}
      ${dots}
      ${xLabels}
    </svg>`;
  }

  // N-record moving average (growing/cumulative until N confirmed points exist), keyed by date so
  // it can be aligned back to the confirmed series it was built from.
  function movingAverageSingle(series, field, n){
    return series.map((p,i)=>{
      const window = series.slice(Math.max(0, i-n+1), i+1);
      const avg = window.reduce((a,x)=>a+x[field],0) / window.length;
      return {date:p.date, ma: round1(avg)};
    });
  }
  function movingAverageDual(series, n){
    return series.map((p,i)=>{
      const window = series.slice(Math.max(0, i-n+1), i+1);
      const avgA = window.reduce((a,x)=>a+x.km,0) / window.length;
      const avgB = window.reduce((a,x)=>a+x.kcal,0) / window.length;
      return {date:p.date, a: round1(avgA), b: Math.round(avgB)};
    });
  }
  // how many of the last N point-to-point changes in a moving-average series were increases
  function maRisingCount(maSeries, field, n){
    if(maSeries.length<2) return {rising:0, compared:0};
    const deltas = [];
    for(let i=1;i<maSeries.length;i++) deltas.push(maSeries[i][field]-maSeries[i-1][field]);
    const lastN = deltas.slice(-n);
    return {rising: lastN.filter(d=>d>0).length, compared: lastN.length};
  }

  // shared "直近7日間合計・前回比" data lookup, used by both the overview mini-cards and the detail score card
  function bodyPartSummary(bodyPart){
    const cardio = isCardio(bodyPart);
    const series = cardio ? rollingSeriesDual(bodyPart) : rollingSeries(bodyPart);
    if(!series.length) return {cardio, series, empty:true};
    const last = series[series.length-1];
    const prev = series.length>1 ? series[series.length-2] : null;
    return {cardio, series, empty:false, last, prev};
  }
  // Tracks the running all-time-best of a daily-filled series and the "previous" best that stood
  // right before the current peak was set. Comparing only to "all other days" (as an earlier version
  // did) breaks the day after a PR: yesterday's rolling total is still riding the same still-active
  // record, so it gets picked up as a competing "previous best" and the margin collapses to 0. Instead,
  // walk the series forward and only update prevBest when a NEW peak is actually set, so the margin
  // stays constant for as long as today's total sits at that peak (even with no training since), and
  // the gap-to-reclaim stays correctly non-zero for every day after the record-supporting session ages
  // out of the 7-day window (not just the first such day).
  function trackBestProgress(series, last, field){
    let runningBest = 0, prevBest = 0;
    series.forEach(p=>{
      if(p.date>last.date) return;
      const v = p[field];
      if(v>runningBest){ prevBest = runningBest; runningBest = v; }
    });
    const current = last[field];
    return {best:runningBest, prevBest, current, atBest: runningBest>0 && current>=runningBest};
  }
  // backed by the daily-filled series (used by the record-tab overview). Rather than a day-over-day
  // delta (which is flat almost every day, since the rolling window barely changes day to day),
  // this surfaces progress toward the best 7-day rolling total ever recorded for that body part — i.e.
  // "how many more kg today to set a new weekly best", or how much the current best was beaten by.
  function bodyPartSummaryOverview(bodyPart){
    const cardio = isCardio(bodyPart);
    const series = cardio ? rollingSeriesDualDailyAll(bodyPart) : rollingSeriesDailyAll(bodyPart);
    if(!series.length) return {cardio, series, empty:true};
    const today = logicalToday();
    const last = series.find(p=>p.date===today) || series[series.length-1];
    if(cardio){
      const km = trackBestProgress(series, last, 'km');
      const kcal = trackBestProgress(series, last, 'kcal');
      return {cardio, series, empty:false, last,
        kmAtBest: km.atBest, kmMargin: round1(km.best-km.prevBest), kmGap: round1(km.best-km.current),
        kcalAtBest: kcal.atBest, kcalMargin: Math.round(kcal.best-kcal.prevBest), kcalGap: Math.round(kcal.best-kcal.current)};
    }
    const vol = trackBestProgress(series, last, 'vol');
    return {cardio, series, empty:false, last, volBest: vol.best,
      volAtBest: vol.atBest, volMargin: round1(vol.best-vol.prevBest), volGap: round1(vol.best-vol.current)};
  }
  // suggests "weight x reps" to close a weekly-record gap: weight = the heaviest set logged across
  // any exercise on this body part's most recent training day; reps = ceil(gap/weight), so hitting
  // that many reps at that weight is guaranteed to close (or exceed) the gap.
  function weightRepsSuggestion(bodyPartKey, gapFloored){
    const sessions = state.sessions.filter(s=>s.bodyPart===bodyPartKey && s.sets.length>0);
    if(!sessions.length) return null;
    const lastDate = sessions.reduce((max,s)=> s.date>max ? s.date : max, sessions[0].date);
    const maxWeight = Math.floor(Math.max(...sessions
      .filter(s=>s.date===lastDate)
      .flatMap(s=>s.sets.map(st=>st.weight))));
    if(maxWeight<=0) return null;
    const reps = Math.max(1, Math.ceil(gapFloored/maxWeight));
    return {weight: maxWeight, reps};
  }
  function deltaBadgeHtml(diff, unit, mini){
    const cls = diff>0?'up':diff<0?'down':'flat';
    const sign = diff>0?'▲':diff<0?'▼':'―';
    return `<span class="score-delta ${cls}${mini?' mini':''}">${sign} ${Math.abs(diff)}${unit}</span>`;
  }
  // same ▲/▼ visual language as deltaBadgeHtml: atBest -> how much the current best beats the
  // previous one by (up/green); otherwise -> how far below the best the current total sits (down/red)
  function prBadgeHtml(atBest, margin, gap, unit){
    if(atBest) return `<span class="score-delta up mini">▲ ${margin}${unit}</span>`;
    return `<span class="score-delta down mini">▼ ${gap}${unit}</span>`;
  }

          <span class="legend-item"><span class="legend-line"></span>${MA_WINDOW}回移動平均</span>
        </div>
        <div class="chart-wrap" id="chart-wrap"></div>
        <div class="range-slider-wrap">
          <div class="range-slider-label" id="range-slider-label">${GRAPH_RANGE_PRESETS[rangeIdx].label}</div>
          <input type="range" id="range-slider" min="0" max="${GRAPH_RANGE_PRESETS.length-1}" step="1" value="${rangeIdx}">
        </div>
        <div class="ma-summary">
          <div class="ma-summary-row">
            <div>
              <div class="ma-summary-label">${MA_WINDOW}回移動平均</div>
              <div class="ma-summary-value" style="color:${b.hex}">${maLast.ma}<span>kg</span></div>
            </div>
            ${maPrev ? deltaBadgeHtml(round1(maLast.ma-maPrev.ma), 'kg', false) : ''}
          </div>
          ${trend.compared>0 ? `<div class="ma-summary-trend">直近${trend.compared}回中 <span class="mono">${trend.rising}回</span> 上昇</div>` : ''}
        </div>
      `;
    }
    el.appendChild(card);

    m.innerHTML='';
    m.appendChild(el);

    // chart (self-contained SVG, no external libraries required) — shows only the slider-selected
    // range, while the score-top/MA summary above always reflect the true, unfiltered full history
    function renderChart(){
      const chartWrap = document.getElementById('chart-wrap');
      if(!displaySeries.length){
        chartWrap.innerHTML = `<div class="empty-state" style="padding:20px 10px; font-size:13px;">この期間の記録はありません。</div>`;
        return;
      }
      const prov = showProvisional && displaySeries.length ? provisionalPoint : null;
      if(cardio){
        const maForChart = movingAverageDual(series, MA_WINDOW).slice(-displaySeries.length);
        chartWrap.innerHTML = buildDualLineChartSVG(
          displaySeries.map(p=>({date:p.date, a:p.km, b:p.kcal})),
          b.hex, CARDIO_KCAL_HEX,
          {provisional: prov, maSeries: maForChart}
        );
      }else{
        const maForChart = movingAverageSingle(series, 'vol', MA_WINDOW).slice(-displaySeries.length);
        chartWrap.innerHTML = buildLineChartSVG(displaySeries, b.hex, {provisional: prov, maSeries: maForChart});
      }
    }
    renderChart();

    document.getElementById('range-slider').addEventListener('input', (e)=>{
      const preset = GRAPH_RANGE_PRESETS[parseInt(e.target.value)];
      ui.graphRangeDays = preset.days;
      state.graphRangeDays = preset.days;
      saveData();
      displaySeries = seriesForRange(preset.days);
      document.getElementById('range-slider-label').textContent = preset.label;
      renderChart();
    });
  }

  // ---------- RECORD TAB: BODY PART OVERVIEW ----------
  // Sits at the top of the record tab. Doubles as the body-part selector (tap a card to switch
  // ui.bodyPart) and as a daily-updating "how am I trending this week" glance, using the
  // daily-filled series so today's rolling total always shows even before you've trained today.
  function buildBodyPartOverview(){
    const el = document.createElement('div');

    const header = document.createElement('div');
    header.className = 'graph-overview-header';
    const title = document.createElement('h2');
    title.className = 'section-title';
    title.textContent = '部位を選択';
    const reorderBtn = document.createElement('button');
    reorderBtn.className = 'reorder-toggle' + (ui.reorderMode ? ' active' : '');
    reorderBtn.textContent = ui.reorderMode ? '完了' : '並び替え';
    reorderBtn.onclick = ()=>{ ui.reorderMode = !ui.reorderMode; render(); };
    header.appendChild(title);
    header.appendChild(reorderBtn);
    el.appendChild(header);

    const list = document.createElement('div');
    list.className = 'mini-card-list';

    state.bodyPartOrder.forEach((key, idx)=>{
      const b = bp(key);
      if(!b) return;
      const summary = bodyPartSummaryOverview(key);

      const card = document.createElement('div');
      card.className = 'mini-card' + (!ui.reorderMode ? ' tappable' : '');

      const main = document.createElement('div');
      main.className = 'mini-card-main';

      if(summary.empty){
        main.innerHTML = `
          <div class="mini-card-top">
            <span class="mini-card-name"><span class="dot" style="background:${b.hex}"></span>${b.label}</span>
          </div>
          <div class="mini-card-empty">まだ記録がありません</div>
        `;
      }else if(summary.cardio){
        const badges = prBadgeHtml(summary.kmAtBest, summary.kmMargin, summary.kmGap, 'km')
          + prBadgeHtml(summary.kcalAtBest, summary.kcalMargin, summary.kcalGap, 'kcal');
        main.innerHTML = `
          <div class="mini-card-top">
            <span class="mini-card-name"><span class="dot" style="background:${b.hex}"></span>${b.label}</span>
            <span class="mini-card-deltas">${badges}</span>
          </div>
          <div class="mini-card-bottom">
            <span class="mini-card-value">${summary.last.km}<span class="unit">km</span><span class="sep">/</span>${summary.last.kcal}<span class="unit">kcal</span></span>
            <span class="mini-sparkline" id="spark-${key}"></span>
          </div>
        `;
      }else{
        // common display rule for this section: non-cardio kg values are truncated to a whole number
        const bestFloored = Math.floor(summary.volBest);
        const marginFloored = Math.floor(summary.volMargin);
        const gapFloored = Math.floor(summary.volGap);
        const badge = prBadgeHtml(summary.volAtBest, marginFloored, gapFloored, 'kg');
        let bottomHtml;
        if(summary.volAtBest){
          bottomHtml = `<span class="mini-card-suggestion">自己ベスト更新中</span>`;
        }else{
          const suggestion = weightRepsSuggestion(key, gapFloored);
          bottomHtml = suggestion
            ? `<span class="mini-card-value">${suggestion.weight}<span class="unit">kg</span><span class="sep">×</span>${suggestion.reps}<span class="unit">回</span></span>`
            : `<span class="mini-card-suggestion">あと${gapFloored}kg</span>`;
        }
        main.innerHTML = `
          <div class="mini-card-top">
            <span class="mini-card-name">
              <span class="dot" style="background:${b.hex}"></span>${b.label}
              <span class="mini-card-best">BEST ${bestFloored}kg</span>
            </span>
            <span class="mini-card-deltas">${badge}</span>
          </div>
          <div class="mini-card-bottom">
            ${bottomHtml}
            <span class="mini-sparkline" id="spark-${key}"></span>
          </div>
        `;
      }
      card.appendChild(main);

      if(ui.reorderMode){
        const reorderCtrl = document.createElement('div');
        reorderCtrl.className = 'mini-card-reorder';
        const upBtn = document.createElement('button');
        upBtn.textContent = '↑';
        upBtn.disabled = idx===0;
        upBtn.onclick = ()=>{
          [state.bodyPartOrder[idx-1], state.bodyPartOrder[idx]] = [state.bodyPartOrder[idx], state.bodyPartOrder[idx-1]];
          saveData(); render();
        };
        const downBtn = document.createElement('button');
        downBtn.textContent = '↓';
        downBtn.disabled = idx===state.bodyPartOrder.length-1;
        downBtn.onclick = ()=>{
          [state.bodyPartOrder[idx+1], state.bodyPartOrder[idx]] = [state.bodyPartOrder[idx], state.bodyPartOrder[idx+1]];
          saveData(); render();
        };
        reorderCtrl.appendChild(upBtn);
        reorderCtrl.appendChild(downBtn);
        card.appendChild(reorderCtrl);
      }else{
        card.onclick = ()=>{
          ui.bodyPart = key;
          ui.exercise = null;
          ui.showAddExercise = false;
          ui.editExercises = false;
          ui.recordView = 'detail';
          render();
        };
      }

      list.appendChild(card);
    });

    el.appendChild(list);
    return el;
  }

  // sparklines must be mounted after buildBodyPartOverview()'s DOM is attached to the page
  function mountOverviewSparklines(){
    state.bodyPartOrder.forEach(key=>{
      const summary = bodyPartSummaryOverview(key);
      if(summary.empty) return;
      const holder = document.getElementById(`spark-${key}`);
      if(!holder) return;
      const b = bp(key);
      if(summary.cardio){
        holder.innerHTML = buildDualLineChartSVG(
          summary.series.map(p=>({date:p.date, a:p.km, b:p.kcal})),
          b.hex, CARDIO_KCAL_HEX, {mini:true}
        );
      }else{
        holder.innerHTML = buildLineChartSVG(summary.series, b.hex, {mini:true, gradId:`spark-grad-${key}`});
      }
    });
  }

  function render(){
    document.querySelectorAll('nav.tabbar button').forEach(b=>{
      b.classList.toggle('active', b.dataset.tab===ui.tab);
    });
    if(ui.tab==='record') renderRecord();
    else if(ui.tab==='history') renderHistory();
    else if(ui.tab==='graph') renderGraphDetail();
  }

  document.querySelectorAll('nav.tabbar button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const enteringRecord = b.dataset.tab==='record';
      ui.tab = b.dataset.tab;
      if(enteringRecord){ ui.recordView = 'overview'; ui.reorderMode = false; }
      render();
    });
  });

  (async function init(){
    await loadData();
    render();
  })();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW registration failed', e));
  });
}
</script>
</body>
</html>
